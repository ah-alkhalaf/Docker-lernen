name: CI

on:
  push:
  pull_request:

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x lab/*.sh lab/lab-check lab/check/*.sh \
                     startup/verify.sh startup/break-fix/run.sh

  app:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: startup/app
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lab compose
        run: docker compose config -q
      - name: Startup compose and break-fix variants
        working-directory: startup
        run: |
          cp .env.example .env
          docker compose config -q
          for f in break-fix/0*.yaml; do
            docker compose --project-directory . -f "$f" config -q
          done

  lab-image:
    name: Lab box starts and accepts SSH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t lab-box .
      - name: Start and smoke-test
        run: |
          docker run -d --name box --init \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add SETUID --cap-add SETGID --cap-add SYS_CHROOT \
            --cap-add KILL --cap-add AUDIT_WRITE --cap-add NET_RAW \
            -e STUDENT_PASSWORD=ci-test-password lab-box
          for i in $(seq 1 20); do
            docker logs box 2>&1 | grep -q "Box ready" && break
            sleep 1
          done
          docker logs box
          docker exec box pgrep -x sshd
          docker exec -u student box lab-check 1 || test $? -eq 1
          docker exec -u student box bash -c 'sudo useradd -m ci-user && id ci-user'
      - name: Show logs on failure
        if: failure()
        run: docker logs box
